<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOG API — 狗狗接口规范 | DOG API</title>
<meta name="description" content="以工程规范文体撰写的狗狗接口规范，含实测数据、运维手册与公开信源。">
<link rel="stylesheet" href="../assets/css/spec.css">
<style>
  .front-matter { border-left: 2px solid var(--accent); background: var(--accent-soft); padding: 16px 20px; margin: 24px 0 34px; border-radius: 0 6px 6px 0; }
  .front-matter h2 { margin-top: 0; }
  .front-matter p:last-child { margin-bottom: 0; }
  .front-matter table { margin: 10px 0 14px; }
</style>
</head>
<body>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="content"></main>
</div>

<script src="../assets/data/dog.js"></script>
<script src="../assets/data/appendices.js"></script>
<script src="../assets/js/render.js"></script>
<script>
  /* 前置区块。定位是「进门前的取向说明」，不是规范正文 ——
     术语、规范强度与不可 Cast 关系的**定义**在 §2.4 与术语表里，这里一个字都不重复，
     只放三条读者不先知道就会误读后面 35 章的约定。 */
  var CONVENTIONS = `
    <div class="front-matter">
      <h2>怎么读这份文档</h2>
      <p>术语、规范强度（<code>MUST</code> / <code>SHOULD</code> / <code>MAY</code> / <code>HEURISTIC</code>）
      与禁止自动 Cast 的关系，定义在 <a href="#conventions">§2.4 Protocol Conventions</a>
      （<code>DOG-conventions</code>）与 <a href="../reference/glossary.html">术语表</a> 里。
      本区块不重复它们，只说三条会影响你解读后面 35 章的约定：</p>
      <ul>
        <li><strong>跨版本引用用规范 ID，不要用节号。</strong>节号由运行时按数组顺序生成，
        任何一次插入或删除都会让其后的编号整体平移。登记表见
        <a href="../reference/norm-ids.html">规范 ID 登记表</a>，文档里的每个标题都带自己的 ID。</li>
        <li><strong>这里的版本号只描述「文本」被编辑到了哪一步</strong>，与那个系统自身的运行版本无关。
        三个互不相干的版本轴见 <a href="../versions.html">历史版本</a>。</li>
        <li><strong>文中每个数字都有出处，或明确标注为 <code>HEURISTIC</code>。</strong>
        信源全部列在《公开信源》一章。先读它，再读正文 —— 知道哪些是真的之后，剩下的部分才好玩。</li>
      </ul>
    </div>
  `;

  SpecSite.render({
    root: "../",
    active: "dog",
    data: window.DOG_DOC,
    appendices: window.DOG_APPENDICES,
    frontMatter: CONVENTIONS,
    heading: "DOG API — 狗狗接口规范",
    sideSubtitle: "v" + SpecSite.VERSION + " · " + window.DOG_DOC.sections.length +
      " 章 + " + window.DOG_APPENDICES.length + " 附录",
    endNote: "本文档不声明任何一只具体的狗等于「默认实例」。它们都远远超出本规范。"
  });
</script>

</body>
</html>

/* ============ 渲染逻辑（模拟 hash 路由） ============ */

const DOCS = { dog: DOG_DOC };

function route() {
  render();
}

function render() {
  const doc = DOG_DOC;
  document.title = doc.title + " — 狗狗接口规范";

  // sidebar
  const nav = document.getElementById("nav");
  nav.innerHTML = doc.sections.map((s, i) =>
    `<a href="#${s.id}" onclick="jump('${s.id}');return false;">${String(i).padStart(2, "0")} ${s.title}</a>`
  ).join("");

  // content
  const main = document.getElementById("content");
  main.innerHTML = `
    <span class="doc-tag">${doc.tag}</span>
    <h1>${doc.title} — 狗狗接口规范</h1>
    <div class="subtitle">${doc.subtitle}</div>
  ` + doc.sections.map((s, i) => `
    <section id="${s.id}">
      <h2><span class="sec-no">${String(i).padStart(2, "0")}</span>${s.title}</h2>
      ${s.html}
    </section>
  `).join("") + `
    <hr class="divider">
    <div class="end-note">— 本文档不声明任何一只具体的 Dog 等于"默认实例"。它们都远远超出本规范。 —</div>
  `;
  window.scrollTo(0, 0);
}

function jump(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

window.addEventListener("hashchange", route);
route();
</script>
